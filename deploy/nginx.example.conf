# Example Nginx sites for the VPS — replace namaa.sa / admin.namaa.sa / api.namaa.sa and the paths.
# Copy to /etc/nginx/sites-available/nemaa, link into sites-enabled, then: nginx -t && systemctl reload nginx
# HTTPS: certbot --nginx -d namaa.sa -d admin.namaa.sa -d api.namaa.sa  (adds the 443 blocks).

# ── API (Node on 127.0.0.1:3000, PM2 process "nemaa-backend") ─────────────────
server {
    listen 80;
    server_name api.namaa.sa;

    # Uploads (PDF documents, images) go through Express; keep in line with the multer limits.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Socket.io (WebSocket upgrade)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# ── NGO website (nemaa_services_Front → SITE_DIR) ─────────────────────────────
server {
    listen 80;
    server_name namaa.sa www.namaa.sa;
    root /var/www/nemaa/site;
    index index.html;

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # Vue Router history mode: unknown paths load the app. index.html is never cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# ── Admin dashboard (nemaa_services_dashboard → DASHBOARD_DIR) ────────────────
server {
    listen 80;
    server_name admin.namaa.sa;
    root /var/www/nemaa/dashboard;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Only when the dashboard is built with VITE_API_BASE_URL=/api (same-origin API):
